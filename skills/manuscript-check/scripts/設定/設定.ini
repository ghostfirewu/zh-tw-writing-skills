; 稿件健檢設定。以 ; 開頭的行是註解。路徑可寫相對路徑（以本檔所在資料夾為準），多個檔案用 | 分隔。

[標點]
; 合法的疊字，不列入「疊字」「詞語重複」
疊字白名單 = 疊字白名單.txt

[簡體]
一簡多繁清單 = 一簡多繁.txt
錯轉清單 = 錯轉.txt

[異形詞]
; 用字體例詞表（內附入門小表，建議換成自己的）；不想檢查就留空
詞表 = 詞表_詞換詞.txt
; 格式：標準譯名,變體1|變體2（一行一組）
譯名表 = 譯名表.txt

[統計]
; 連續幾個字沒有任何標點就列出
無標點長串 = 60
; 一句（到句號、問號、驚嘆號、分號為止）超過幾字就列出
長句 = 150
; 一段超過幾字就列出
長段 = 600

[外文]
; 幾個字母以上的外文詞才納入比對
最短字母數 = 5
; 出現幾次以下算罕見形
罕見上限 = 3
; 出現幾次以上算高頻形
高頻下限 = 8
; 高頻形至少要是罕見形的幾倍
倍數 = 5

[排版比對]
; 頁面最上面、最下面多少比例的範圍算頁首頁尾（0.07＝7%）。正文被誤排除時調小，頁首頁尾沒排乾淨時調大
頁首範圍 = 0.07
頁尾範圍 = 0.07
; 字級小於正文幾倍、又在頁面最後一行正文之後的行，算隨頁註腳
註腳字級比 = 0.92
; 正文裡字級小於正文幾倍的數字與 *†‡，算上標注碼（原稿裡沒有這些字）
注碼字級比 = 0.8
; 等價字元：外觀相同、排版時常被統一替換的字元，只計數不列明細。格式：原稿=排版稿，多組用 | 分隔
等價字元 = ・=．|·=．|‧=．|——=⸺|──=⸺|—=⸺

[索引]
; 頁首頁尾範圍、註腳判定沿用上面 [排版比對] 的設定
; PDF 頁 − 書頁 的差（例：前面有 12 頁前頁、第 13 頁印「1」就填 12）。留空＝從頁尾頁碼自動推算
頁碼差 =
; 只找這些 PDF 頁（例：13-320，用來略過前頁、參考文獻、索引本身）。留空＝全部
掃描範圍 =
; 自動略過目次頁（同一頁 3 行以上是「點線引線＋頁碼」）：是／否
略過目次 = 是
; 註腳裡的出現也算：是／否
含註腳 = 是
; 只出現在註腳的頁碼後面加的標記（例：n → 45n）。留空＝不加
註腳標記 =
; 索引排序：原順序（照詞表）／筆畫（首字筆畫，同筆畫依部首；筆畫資料來自 Unicode Unihan，在 data\筆畫表.tsv）
排序 = 原順序
; 排序為筆畫時，西文與數字開頭的詞條：放後面／放前面
西文詞條 = 放後面
; 排序為筆畫時，在每組筆畫前加「【3 畫】」這類標題：是／否
